<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Form | نظام طلبات المصنع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #e8a020;
    --accent2: #2e7d9e;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #dde3ec;
    --text: #1e2d3d;
    --muted: #7a8fa6;
    --success: #2a9d5c;
    --danger: #e53e3e;
    --row-odd: #f9fbfd;
    --row-even: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, #0f2540 100%);
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .header-title {
    color: white;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }
  .header-title span {
    color: var(--accent);
    display: block;
    font-size: 13px;
    font-weight: 400;
    font-family: 'Barlow', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .header-badge {
    background: var(--accent);
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 20px;
    font-family: 'Barlow', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Main Container */
  .container {
    max-width: 820px;
    margin: 36px auto;
    padding: 0 20px 60px;
  }

  /* Card */
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.07);
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .card-header {
    background: linear-gradient(90deg, var(--primary) 0%, var(--accent2) 100%);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-header .icon {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .card-header h2 {
    color: white;
    font-size: 15px;
    font-weight: 700;
  }
  .card-header h2 span {
    color: rgba(255,255,255,0.65);
    font-size: 11px;
    font-family: 'Barlow', sans-serif;
    font-weight: 400;
    letter-spacing: 1px;
    margin-right: 8px;
  }
  .card-body { padding: 24px; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .field label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    font-family: 'Barlow', sans-serif;
  }
  .field label .ar {
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    color: var(--text);
  }
  .field label .required { color: var(--danger); margin-right: 3px; }

  input, select, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }
  input:focus, select:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(46,125,158,0.1);
  }

  .readonly-field {
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #f0f4f8;
    color: var(--muted);
    font-weight: 600;
  }

  .grand-total {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(90deg, var(--primary), var(--accent2));
    border-radius: 12px;
    margin-top: 16px;
    color: white;
  }
  .grand-total .amount {
    color: var(--accent);
    font-size: 24px;
    font-weight: 900;
    font-family: 'Barlow', sans-serif;
  }

  .submit-area { text-align: center; margin-top: 20px; }
  .btn-submit {
    background: linear-gradient(135deg, var(--accent) 0%, #c87d10 100%);
    color: white;
    border: none;
    padding: 16px 60px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(232,160,32,0.35);
  }

  .success-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,30,50,0.7);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  .success-overlay.show { display: flex; }
  .success-box {
    background: white;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    max-width: 380px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <span>Factory Order System</span>
    نظام طلبات المصنع
  </div>
  <div class="header-badge">ProPack</div>
</div>

<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="icon">📋</div>
      <h2>معلومات الطلب <span>Order Information</span></h2>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field">
          <label><span class="ar">تاريخ الطلب</span> Order Date <span class="required">*</span></label>
          <input type="date" id="orderDate" required>
        </div>
        <div class="field">
          <label><span class="ar">اسم المندوب</span> Sales Rep <span class="required">*</span></label>
          <select id="salesRep" required>
            <option value="">-- اختر المندوب --</option>
            <option value="Osama | أسامة">Osama | أسامة</option>
            <option value="Mahbob | محبوب">Mahbob | محبوب</option>
            <option value="Mahmoud Gebriel | محمود جبريل">Mahmoud Gebriel | محمود جبريل</option>
            <option value="Burhan | برهان">Burhan | برهان</option>
          </select>
        </div>
        <div class="field">
          <label><span class="ar">اسم العميل</span> Customer <span class="required">*</span></label>
          <input type="text" id="customerName" placeholder="اسم العميل..." required>
        </div>
        <div class="field">
          <label><span class="ar">حالة الكليشة</span> Cliché Status <span class="required">*</span></label>
          <select id="clicheStatus" required>
            <option value="">-- اختر الحالة --</option>
            <option value="جاري التحضير | In Preparation">جاري التحضير | In Preparation</option>
            <option value="في المصنع | At Factory">في المصنع | At Factory</option>
          </select>
        </div>
      </div>
      <div style="margin-top: 18px;">
        <div class="field">
          <label><span class="ar">ملاحظات</span> Notes</label>
          <textarea id="notes" rows="2"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="icon">📦</div>
      <h2>تفاصيل الطلب <span>Order Details</span></h2>
    </div>
    <div class="card-body">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px;">
        <div class="field">
          <label><span class="ar">نوع المنتج</span> Product Type <span class="required">*</span></label>
          <select id="productType" required onchange="filterByType()">
            <option value="">-- اختر النوع --</option>
            <option value="أكواب ساكو PP | Saco PP Cups">أكواب ساكو PP | Saco PP Cups</option>
            <option value="أكواب PET | PET Cups">أكواب PET | PET Cups</option>
            <option value="أكواب مشبر | Frosted Cups">أكواب مشبر | Frosted Cups</option>
            <option value="أكواب ورقية | Paper Cups">أكواب ورقية | Paper Cups</option>
          </select>
        </div>
        <div class="field">
          <label><span class="ar">هل يوجد عينة؟</span> Sample? <span class="required">*</span></label>
          <select id="hasSample" required>
            <option value="">-- اختر --</option>
            <option value="نعم | Yes">نعم | Yes</option>
            <option value="لا | No">لا | No</option>
          </select>
        </div>
      </div>

      <div id="orderLines"></div>

      <button type="button" onclick="addLine()" style="margin-top:14px; width:100%; padding:12px; border:2px dashed var(--accent2); background:transparent; color:var(--accent2); border-radius:10px; cursor:pointer; font-weight:700;">
        ＋ إضافة صنف آخر | Add Item
      </button>

      <div class="grand-total">
        <div class="label">إجمالي الطلب | Grand Total</div>
        <div class="amount" id="grandTotal">0.00</div>
      </div>
    </div>
  </div>

  <div class="submit-area">
    <button class="btn-submit" onclick="submitForm()">✅ تأكيد وإرسال الطلب</button>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div style="font-size: 50px; color: var(--success);">✓</div>
    <h3>تم الإرسال بنجاح!</h3>
    <p>تم تسجيل الطلب في قاعدة البيانات.</p>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; background:var(--primary); color:white; border:none; border-radius:5px; cursor:pointer;">طلب جديد</button>
  </div>
</div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbwjU6cs5CCAsg7Aqh76u0OWVOMi1z8dnZAuDkWa3yhPsRI4vLkeuhy2wCJFHBZ0r11fBw/exec';

const products = [
  { en: "Saco Cup 16oz Clear", ar: "كوب ساكو 16 أوز شفاف", unit: "pcs", hasPrice: true, category: "cup" },
  { en: "Saco Cup 12oz Clear", ar: "كوب ساكو 12 أوز شفاف", unit: "pcs", hasPrice: true, category: "cup" },
  { en: "PET Cup 400ml Printed", ar: "كوب PET 400مل مطبوع", unit: "pcs", hasPrice: true, category: "cup" },
  { en: "Paper Cup 8oz", ar: "جلاص ورقي 8 أوز", unit: "pcs", hasPrice: true, category: "paper" },
  { en: "Cliche", ar: "كليشة", unit: "pcs", hasPrice: true, category: "cliche" }
];

let lineCount = 0;

function filterByType() {
  document.getElementById('orderLines').innerHTML = '';
  lineCount = 0;
  addLine();
}

function addLine() {
  const id = lineCount++;
  const container = document.getElementById('orderLines');
  const div = document.createElement('div');
  div.id = `line_${id}`;
  div.style.cssText = 'background:#f9fbfd; border:1.5px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; position:relative;';
  
  let options = '<option value="">-- اختر الصنف --</option>';
  products.forEach(p => {
    options += `<option value="${p.en}" data-ar="${p.ar}" data-unit="${p.unit}">${p.ar} | ${p.en}</option>`;
  });

  div.innerHTML = `
    <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px;">
      <select id="prod_${id}" onchange="calcGrandTotal()">${options}</select>
      <input type="number" id="qty_${id}" placeholder="الكمية" oninput="calcGrandTotal()">
      <input type="number" id="price_${id}" placeholder="السعر" step="0.01" oninput="calcGrandTotal()">
    </div>
  `;
  container.appendChild(div);
}

function calcGrandTotal() {
  let grand = 0;
  document.querySelectorAll('[id^="line_"]').forEach(line => {
    const id = line.id.replace('line_', '');
    const qty = parseFloat(document.getElementById(`qty_${id}`).value) || 0;
    const price = parseFloat(document.getElementById(`price_${id}`).value) || 0;
    grand += qty * price;
  });
  document.getElementById('grandTotal').textContent = grand.toFixed(2);
}

function submitForm() {
  const date = document.getElementById('orderDate').value;
  const rep = document.getElementById('salesRep').value;
  const customer = document.getElementById('customerName').value;
  const cliche = document.getElementById('clicheStatus').value;
  const productType = document.getElementById('productType').value;
  const hasSample = document.getElementById('hasSample').value;
  const notes = document.getElementById('notes').value;

  if (!date || !rep || !customer) { alert('أكمل البيانات الأساسية'); return; }

  const rows = [];
  document.querySelectorAll('[id^="line_"]').forEach(line => {
    const id = line.id.replace('line_', '');
    const sel = document.getElementById(`prod_${id}`);
    if (!sel.value) return;
    
    const opt = sel.options[sel.selectedIndex];
    const qty = document.getElementById(`qty_${id}`).value;
    const price = document.getElementById(`price_${id}`).value;

    rows.push({
      date, rep, customer, cliche, productType, hasSample,
      delivery: '10-15 Days | يوم',
      product: `${opt.dataset.ar} | ${sel.value}`,
      qty, price,
      total: (parseFloat(qty) * parseFloat(price)).toFixed(2),
      notes
    });
  });

  if (rows.length === 0) { alert('أضف صنف واحد على الأقل'); return; }

  fetch(scriptURL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rows: rows })
  })
  .then(() => {
    document.getElementById('successOverlay').classList.add('show');
  })
  .catch(err => alert('خطأ في الإرسال: ' + err.message));
}

// تشغيل أول سطر تلقائياً
window.onload = () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('orderDate').value = today;
  addLine();
};
</script>

</body>
</html>
